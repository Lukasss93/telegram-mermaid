name: Deploy
on:
  push:
    tags:
      - '*'
jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    environment: 'Production'
    steps:
      - name: Deploy to production server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd ${{ secrets.PROJECT_PATH}}
            php8.6 artisan down
            git fetch --all -p
            git reset --hard
            git pull "https://Lukasss93:${{ secrets.GIT_TOKEN }}@github.com/Lukasss93/telegram-mermaid.git" master
            wget -q https://getcomposer.org/composer-stable.phar -O composer.phar
            php8.6 composer.phar install --no-dev --optimize-autoloader --no-ansi --no-interaction --no-progress
            php8.6 artisan migrate --force --step
            php8.6 artisan optimize
            php8.6 artisan nutgram:register-commands
            php8.6 artisan up
            echo 'DONE!'
